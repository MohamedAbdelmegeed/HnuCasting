<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>روابط مهمة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    color: #1e2a3a;
    background: linear-gradient(160deg, #ffffff 0%, #eaf6ff 55%, #d6ecff 100%);
    background-attachment: fixed;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }
  .card {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 20px; text-decoration: none; color: inherit;
    background: rgba(255,255,255,.75);
    border: 1px solid #cfe6fa; border-radius: 20px;
    box-shadow: 0 6px 20px rgba(120,170,220,.18);
    backdrop-filter: blur(6px);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(120,170,220,.28); }
  .icon {
    flex: 0 0 52px; width: 52px; height: 52px; border-radius: 16px;
    display: grid; place-items: center;
  }
  .icon svg { width: 28px; height: 28px; }
  .form .icon { background: #e6defa; color: #6b4fc4; }
  .icon.logo { background: none; border-radius: 50%; width: 60px; height: 60px; flex-basis: 60px; box-shadow: 0 3px 10px rgba(31,111,209,.3); }
  .icon.logo img { width: 100%; height: 100%; border-radius: 50%; display: block; }
  .text { flex: 1; min-width: 0; }
  .text b { display: block; font-size: 17px; line-height: 1.5; }
  .text span { font-size: 13px; color: #6a7c92; }
  .arrow { color: #9bb7d4; font-size: 20px; }

  body { flex-direction: column; align-items: stretch; justify-content: flex-start; padding: 0; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #fff; }
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px clamp(14px, 4vw, 40px);
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid #dcebf8;
    box-shadow: 0 4px 18px rgba(120,170,220,.12);
  }
  .nav img { display: block; height: 52px; width: auto; flex: 0 0 auto; }
  .nav .care { height: 54px; width: 54px; border-radius: 50%; box-shadow: 0 2px 8px rgba(31,58,95,.25); }
  .title { flex: 1; text-align: center; min-width: 0; }
  .title h1 { margin: 0; font-size: clamp(15px, 3.6vw, 22px); font-weight: 700; color: #1f3a5f; line-height: 1.4; letter-spacing: .2px; }
  .title p { margin: 2px 0 0; font-size: clamp(11px, 2.6vw, 13px); color: #7b8da3; font-weight: 500; }
  .title .line { width: 36px; height: 2px; margin: 6px auto 0; border-radius: 2px; background: #bcd9f2; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 28px 24px 40px; }
  @media (max-width: 480px) { .nav img { height: 40px; } .nav .care { height: 42px; width: 42px; } }
</style>
</head>
